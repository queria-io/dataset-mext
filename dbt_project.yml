name: "mext"
version: "1.0.0"

profile: "mext"

model-paths: ["models"]
macro-paths: ["shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  mext:
    +database: mext
    +materialized: table
    plans:
      raw:
        +materialized: table
      stg:
        +materialized: view
      mart:
        +materialized: table
    # raw は取得したまま、stg は型付けと列名の付け替え。どちらも mart の SQL に展開し、テーブルは作らない
    school_codes:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
