name: Build

# 公開せずに取得と dbt build だけを回す。学校コード一覧の形が変わったときに Sync より先に気づくため
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -c "import main; main.download_school_codes()"
      - run: uv run python -c "from pipelines import plans; plans.download_plans(); plans.build_plans_parquet()"
      - run: uv run dbt build --profiles-dir ci
